# SonarQube, run on demand (not in CI) for what golangci-lint doesn't show: cognitive complexity,
# duplication across the tree and coverage per package.
#
#   go test ./... -coverprofile=coverage.out
#   docker run --rm --network host -v "$PWD:/usr/src" -e SONAR_TOKEN=... sonarsource/sonar-scanner-cli
#
# sonar.host.url defaults to http://localhost:9000; pass -Dsonar.host.url=... for another server.

sonar.projectKey=repeatertastic
sonar.projectName=RepeaterTastic
sonar.sourceEncoding=UTF-8

# ui/mock is the dev server's fake daemon: its random data is not a security finding.
sonar.sources=cmd,internal,sdk,ui/src,deploy,Dockerfile
sonar.tests=cmd,internal,sdk
sonar.test.inclusions=**/*_test.go
sonar.exclusions=\
  internal/web/dist/**,\
  **/testdata/**
sonar.coverage.exclusions=\
  **/*_test.go,\
  internal/mtclient/mtclienttest/**,\
  ui/**

sonar.go.coverage.reportPaths=coverage.out
